<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TalkBook 激活码生成器</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f5f7f5;
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 40px 16px;
    color: #1a1a1a;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.06);
    padding: 32px;
    width: 100%;
    max-width: 480px;
  }
  h1 {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .sub {
    color: #888;
    font-size: 13px;
    margin-bottom: 24px;
  }
  .field { margin-bottom: 16px; }
  label {
    display: block;
    font-size: 13px;
    color: #555;
    margin-bottom: 6px;
    font-weight: 500;
  }
  input, select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    font-size: 14px;
    background: #fff;
    outline: none;
    transition: border-color 0.2s;
  }
  input:focus, select:focus { border-color: #22c55e; }
  .row { display: flex; gap: 12px; }
  .row > .field { flex: 1; }
  .btn-row { display: flex; gap: 10px; margin: 20px 0 16px; }
  button {
    flex: 1;
    padding: 11px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  button:hover { opacity: 0.9; }
  .btn-primary { background: #22c55e; color: #fff; }
  .btn-secondary { background: #f0f0f0; color: #333; }
  .result {
    background: #fafafa;
    border: 1px solid #eee;
    border-radius: 8px;
    padding: 14px;
    min-height: 160px;
    max-height: 320px;
    overflow-y: auto;
    font-family: "Consolas", "Monaco", monospace;
    font-size: 14px;
    line-height: 1.8;
    white-space: pre;
  }
  .result:empty::before {
    content: "生成的激活码会显示在这里";
    color: #bbb;
  }
  .tip {
    margin-top: 12px;
    font-size: 12px;
    color: #999;
    text-align: center;
  }
</style>
</head>
<body>
<div class="card">
  <h1>TalkBook 激活码生成器</h1>
  <div class="sub">所有计算均在浏览器本地完成，不联网</div>

  <div class="field">
    <label>激活日期</label>
    <input type="date" id="activated">
  </div>

  <div class="row">
    <div class="field">
      <label>套餐</label>
      <select id="plan">
        <option value="1">日卡（1 天）</option>
        <option value="7">周卡（7 天）</option>
        <option value="30" selected>月卡（30 天）</option>
      </select>
    </div>
    <div class="field">
      <label>生成数量</label>
      <input type="number" id="count" value="1" min="1" max="100">
    </div>
  </div>

  <div class="btn-row">
    <button class="btn-primary" onclick="doGenerate()">生成激活码</button>
    <button class="btn-secondary" onclick="copyAll()">复制全部</button>
  </div>

  <div class="result" id="result"></div>
  <div class="tip">格式 XXXX-XXXX-XXXX-XXXX · 与软件 license.py 解码逻辑对称</div>
</div>

<script>
  // 必须与 talkbook/license.py 完全一致
  // _XOR_KEY = bytes(b ^ 0x5A for b in base64.b64decode("c29tZXNlY3Jld2tleTEyMzQ1"))[:8]
  // atob("c29tZXNlY3Jld2tleTEyMzQ1") = "somesecretkey12345"
  const XOR_KEY = Array.from(atob("c29tZXNlY3Jld2tleTEyMzQ1")).map(c => c.charCodeAt(0) ^ 0x5A);
  const EPOCH = Date.UTC(2025, 0, 1); // 2025-01-01

  // 默认今天
  document.getElementById('activated').value = new Date().toISOString().slice(0, 10);

  function generateCode(activatedDate, days) {
    const delta = Math.floor((activatedDate - EPOCH) / 86400000);
    if (delta < 0) throw new Error("激活日期不能早于 2025-01-01");

    // 8 字节明文
    const plain = new Uint8Array(8);
    // bytes 0-3: days since epoch, uint32 big-endian
    plain[0] = (delta >>> 24) & 0xFF;
    plain[1] = (delta >>> 16) & 0xFF;
    plain[2] = (delta >>> 8) & 0xFF;
    plain[3] = delta & 0xFF;
    // byte 4: duration days
    plain[4] = days & 0xFF;
    // bytes 5-7: random salt
    const salt = new Uint8Array(3);
    crypto.getRandomValues(salt);
    plain[5] = salt[0];
    plain[6] = salt[1];
    plain[7] = salt[2];

    // XOR 混淆
    const obf = new Uint8Array(8);
    for (let i = 0; i < 8; i++) obf[i] = plain[i] ^ XOR_KEY[i % 8];

    // hex 大写
    const h = Array.from(obf).map(b => b.toString(16).padStart(2, '0').toUpperCase()).join('');
    return `${h.slice(0,4)}-${h.slice(4,8)}-${h.slice(8,12)}-${h.slice(12,16)}`;
  }

  function doGenerate() {
    const dateStr = document.getElementById('activated').value;
    const days = parseInt(document.getElementById('plan').value, 10);
    const count = Math.max(1, Math.min(100, parseInt(document.getElementById('count').value, 10) || 1));
    if (!dateStr) { alert('请选择激活日期'); return; }

    const activatedDate = Date.UTC(
      parseInt(dateStr.slice(0,4), 10),
      parseInt(dateStr.slice(5,7), 10) - 1,
      parseInt(dateStr.slice(8,10), 10)
    );

    const lines = [];
    try {
      for (let i = 0; i < count; i++) {
        lines.push(generateCode(activatedDate, days));
      }
    } catch (e) {
      alert(e.message);
      return;
    }
    document.getElementById('result').textContent = lines.join('\n');
  }

  function copyAll() {
    const text = document.getElementById('result').textContent.trim();
    if (!text) { alert('还没有生成任何激活码'); return; }
    navigator.clipboard.writeText(text).then(
      () => alert('已复制到剪贴板'),
      () => {
        // fallback
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        alert('已复制到剪贴板');
      }
    );
  }
</script>
</body>
</html>
